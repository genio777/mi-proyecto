name: Build Android APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Recuperar la misma instantánea verificada que usa la web
        run: |
          npm run prepare:catalog
          node scripts/import-international.mjs
          cp source-index.html index.html
      - run: npm run build
      - run: npm run validate:build
      - name: Preparar Android y permisos GPS
        run: node scripts/prepare-android.mjs
      - name: Verificar datos incluidos en el APK
        run: |
          test -s android/app/src/main/assets/public/data/chargers-spain.json
          test -s android/app/src/main/assets/public/data/international/index.json
          grep -q 'android.permission.ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' android/app/src/main/AndroidManifest.xml
      - name: Compilar APK de depuración
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CargaGratis-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
