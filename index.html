<!doctype html><html lang="es"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#0b7a3e"/><link rel="manifest" href="./manifest.webmanifest"/><title>CargaGratis España</title></head><body><div id="root"><p style="font-family:system-ui;padding:24px">Cargando CargaGratis España…</p></div><script>
window.addEventListener('error',function(e){var r=document.getElementById('root');if(r&&r.textContent.includes('Cargando CargaGratis'))r.textContent='Error al iniciar CargaGratis: '+(e.message||'Error desconocido')+' · '+(e.filename||'')});
window.addEventListener('unhandledrejection',function(e){var r=document.getElementById('root');if(r&&r.textContent.includes('Cargando CargaGratis'))r.textContent='Error de carga: '+String(e.reason)});
setTimeout(function(){var r=document.getElementById('root');if(r&&r.textContent.includes('Cargando CargaGratis'))r.innerHTML='<p style="padding:24px;font-family:system-ui">La aplicación no ha arrancado. Abre esta dirección sin la caché o envíanos esta pantalla para diagnosticar el fallo.</p>'},8000);
</script><script type="module" src="./src/main.tsx"></script></body></html>
