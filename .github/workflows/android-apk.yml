name: Build Android APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Recuperar la misma instantánea verificada que usa la web
        run: |
          npm run prepare:catalog
          node scripts/import-international.mjs
          cp source-index.html index.html
      - run: npm run build
      - run: npm run validate:build
      - name: Preparar Android y permisos GPS
        run: node scripts/prepare-android.mjs
      - name: Verificar datos incluidos en el APK
        run: |
          test -s android/app/src/main/assets/public/data/chargers-spain.json
          test -s android/app/src/main/assets/public/data/international/index.json
          grep -q 'android.permission.ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' android/app/src/main/AndroidManifest.xml
      - name: Compilar APK de depuración
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Habilitar aceleración del emulador
        run: |
          test -e /dev/kvm || { echo '::error::No hay KVM para ejecutar las pruebas Android'; exit 1; }
          sudo chmod a+rw /dev/kvm
      - name: Ejecutar aplicación real en Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -memory 2048 -cores 2
          script: bash android-tests/run-smoke.sh
      - name: Conservar pruebas y diagnóstico Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-runtime-report
          if-no-files-found: warn
          path: |
            android-test-results/
            android/app/build/outputs/androidTest-results/
            android/app/build/reports/androidTests/
      - uses: actions/upload-artifact@v4
        with:
          name: CargaGratis-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
