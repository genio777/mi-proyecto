name: Compilar y publicar CargaGratis España
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '20 4 * * *'
permissions:
  contents: write
concurrency:
  group: cargagratis-branch-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install
      - name: Restaurar HTML fuente de Vite
        run: cp source-index.html index.html
      - name: Importar cargadores oficiales DGT
        id: import_dgt
        continue-on-error: true
        run: node scripts/import-national.mjs
      - name: Informar estado del catálogo
        if: steps.import_dgt.outcome == 'failure'
        run: echo '::warning::Falló la importación DGT. Se publica la aplicación sin inventar cargadores; el mapa informará que no hay catálogo disponible.'
      - name: Completar Superchargers Tesla desde catálogo comunitario
        continue-on-error: true
        run: node scripts/import-tesla.mjs
      - name: Compilar CargaGratis
        run: npm run build
      - name: Verificar archivos compilados
        shell: bash
        run: |
          test -s dist/index.html
          test -d dist/assets
          grep -q '/assets/' dist/index.html || grep -q './assets/' dist/index.html
          if grep -q 'src/main.tsx' dist/index.html; then echo 'ERROR: HTML sin compilar'; exit 1; fi
      - name: Publicar compilación también en la raíz de main
        shell: bash
        run: |
          set -euo pipefail
          # Evita conflictos cuando otra compilación publica antes que esta.
          # Guardamos dist fuera del árbol Git antes de sincronizar main.
          mkdir -p /tmp/cargagratis-dist
          cp -a dist/. /tmp/cargagratis-dist/
          git fetch origin main
          git reset --hard origin/main
          cp -a /tmp/cargagratis-dist/. ./
          git config user.name 'cargagratis-deploy-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- index.html assets data manifest.webmanifest sw.js 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Publish compiled CargaGratis site [skip ci]'
            git push origin HEAD:main
          fi
      - name: Verificar HTML publicado en la rama
        run: |
          test -s index.html
          test -d assets
          if grep -q 'src/main.tsx' index.html; then echo 'ERROR: se está publicando código fuente sin compilar'; exit 1; fi
          echo 'OK: aplicación compilada y preparada para GitHub Pages desde main'

