name: Deploy CargaGratis España to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '20 4 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install
      - name: Importar cargadores oficiales DGT
        run: node scripts/import-national.mjs
      - name: Compilar CargaGratis
        run: npm run build
      - name: Verificar archivos compilados
        shell: bash
        run: |
          test -s dist/index.html
          test -d dist/assets
          grep -q '/assets/' dist/index.html || grep -q './assets/' dist/index.html
          if grep -q 'src/main.tsx' dist/index.html; then echo 'ERROR: HTML sin compilar'; exit 1; fi
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir aplicación compilada
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Comprobar web publicada y JavaScript
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          echo "URL publicada: $PAGE_URL"
          for attempt in 1 2 3 4 5 6; do
            curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "${PAGE_URL}?v=${GITHUB_SHA}" -o /tmp/cargagratis-page.html && break
            echo "Esperando propagación GitHub Pages... $attempt"
            sleep 15
          done
          test -s /tmp/cargagratis-page.html
          if grep -q 'src/main.tsx' /tmp/cargagratis-page.html; then
            echo 'ERROR: GitHub Pages está sirviendo el HTML fuente, NO dist/index.html.'
            echo 'Solución: Settings > Pages > Source > GitHub Actions.'
            exit 1
          fi
          JS_PATH=$(grep -oE 'src="[^"]+\.js"' /tmp/cargagratis-page.html | head -1 | cut -d '"' -f 2)
          if [ -z "$JS_PATH" ]; then echo 'ERROR: no hay bundle JavaScript en la página publicada'; exit 1; fi
          JS_URL=$(python3 -c 'from urllib.parse import urljoin;import os;print(urljoin(os.environ["PAGE_URL"],os.environ["JS_PATH"]))' )
          curl -fsSL --max-time 25 "$JS_URL" -o /tmp/cargagratis-app.js
          test -s /tmp/cargagratis-app.js
          echo "OK: HTML compilado y JavaScript publicados en $PAGE_URL"
