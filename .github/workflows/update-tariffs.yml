name: Actualizar tarifas operadores
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cargagratis-catalog-publish
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Actualizar fuentes públicas
        run: node scripts/update-tariffs.mjs
      - name: Guardar cambios
        run: |
          git config user.name "CargaGratis Bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          cp public/data/operator-tariffs.json data/operator-tariffs.json
          git add public/data/operator-tariffs.json data/operator-tariffs.json
          git diff --cached --quiet || git commit -m "Actualiza tarifas diarias"
          git push
