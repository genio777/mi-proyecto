name: Compilar y publicar CargaGratis España
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: write
concurrency:
  group: cargagratis-catalog-publish
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Recuperar catálogo publicado y HTML fuente
        run: |
          npm run prepare:catalog
          cp source-index.html index.html
      - name: Actualizar catálogo oficial DGT
        id: import_dgt
        continue-on-error: true
        run: node scripts/import-national.mjs
      - name: Conservar último catálogo si falla DGT
        if: steps.import_dgt.outcome == 'failure'
        run: echo '::warning::DGT no accesible. Se conserva la última importación con su fecha original.'
      - name: Integrar registro MITECO si ofrece un CSV válido
        continue-on-error: true
        run: python3 scripts/import-miteco-ripree.py
      - name: Conservar cobertura internacional y atribuciones
        run: node scripts/import-international.mjs
      - name: Recuperar presupuesto REVE duradero
        uses: actions/cache/restore@v4
        with:
          path: .state/reve-budget.json
          key: reve-budget-main-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: reve-budget-main-
      - name: Reservar consultas antes de contactar con REVE
        id: reve_budget
        run: node scripts/reserve-reve-budget.mjs
      - name: Persistir la reserva incluso si falla la compilación posterior
        if: steps.reve_budget.outputs.allowed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .state/reve-budget.json
          key: reve-budget-main-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Confirmar que la reserva quedó guardada
        if: steps.reve_budget.outputs.allowed == 'true'
        id: reve_budget_confirm
        uses: actions/cache/restore@v4
        with:
          path: .state/reve-budget.json
          key: reve-budget-main-${{ github.run_id }}-${{ github.run_attempt }}
          lookup-only: true
      - name: Recuperar cursor REVE incluso tras una publicación fallida
        uses: actions/cache/restore@v4
        with:
          path: .state/reve-cache.json
          key: reve-cursor-main-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: reve-cursor-main-
      - name: Restaurar inventario REVE de la última consulta
        run: |
          if test -s .state/reve-cache.json; then
            cp .state/reve-cache.json public/data/reve-cache.json
          fi
      - name: Comprobar caducidad REVE y conservar datos anteriores si hace falta
        env:
          REVE_API_KEY: ${{ secrets.REVE_API_KEY }}
          REVE_API_KEY_EXPIRES_ON: ${{ vars.REVE_API_KEY_EXPIRES_ON || '2027-10-29' }}
        run: node scripts/check-reve-credential.mjs
      - name: Integrar REVE con secreto exclusivo de Actions
        id: reve
        env:
          REVE_API_KEY: ${{ secrets.REVE_API_KEY }}
          REVE_API_KEY_EXPIRES_ON: ${{ vars.REVE_API_KEY_EXPIRES_ON || '2027-10-29' }}
          REVE_SKIP_NETWORK: ${{ steps.reve_budget.outputs.allowed != 'true' || steps.reve_budget_confirm.outputs.cache-hit != 'true' }}
        run: node scripts/import-reve.mjs
      - name: Conservar cursor normalizado sin credenciales
        if: steps.reve.outcome == 'success'
        run: cp public/data/reve-cache.json .state/reve-cache.json
      - name: Guardar cursor REVE
        if: steps.reve.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .state/reve-cache.json
          key: reve-cursor-main-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Integrar únicamente precios individuales con evidencia
        run: |
          node scripts/audit-price-candidates.mjs
          node scripts/merge-verified-prices.mjs
      - run: npm run build
      - run: npm run validate:build
      - name: Impedir la publicación de credenciales REVE
        env:
          REVE_API_KEY: ${{ secrets.REVE_API_KEY }}
        run: node scripts/assert-no-secrets.mjs
      - name: Publicar compilación en main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cargagratis-dist
          cp -a dist/. /tmp/cargagratis-dist/
          BUILD_REV="$(git rev-parse --short HEAD)"
          sed -i -E "s@(src|href)=\"(\\./assets/[^\"]+)\"@\\1=\"\\2?v=${BUILD_REV}\"@g" /tmp/cargagratis-dist/index.html
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::main cambió durante la compilación; se evita sobrescribir datos más recientes. La siguiente ejecución recalculará."
            exit 1
          fi
          cp -a /tmp/cargagratis-dist/. ./
          git config user.name 'cargagratis-deploy-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- index.html assets data manifest.webmanifest sw.js geocoding-config.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish compiled CargaGratis site [skip ci]'
            git push origin HEAD:main
          fi
