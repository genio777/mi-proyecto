name: Actualizar cargadores España
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update-chargers.mjs'
      - '.github/workflows/update-chargers.yml'
  schedule:
    - cron: '37 3 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-chargers.mjs
      - name: Guardar cambios
        run: |
          git config user.name "cargagratis-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/chargers-spain.json
          git diff --cached --quiet || git commit -m "Actualiza cargadores oficiales RIPREE"
          git push
