name: Verificar acceso y caducidad REVE
on:
  workflow_dispatch:
  schedule:
    - cron: '31 6 * * *'
permissions:
  contents: read
concurrency:
  group: cargagratis-reve-credential-check
  cancel-in-progress: false
jobs:
  credential:
    if: github.ref != 'refs/heads/OPI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Comprobar presencia y fecha sin mostrar la clave
        id: credential
        env:
          REVE_API_KEY: ${{ secrets.REVE_API_KEY }}
          REVE_API_KEY_EXPIRES_ON: ${{ vars.REVE_API_KEY_EXPIRES_ON || '2027-10-29' }}
        run: node scripts/check-reve-credential.mjs --strict
      - name: Verificar autenticación real bajo demanda (una consulta)
        if: github.event_name == 'workflow_dispatch'
        env:
          REVE_API_KEY: ${{ secrets.REVE_API_KEY }}
          REVE_API_KEY_EXPIRES_ON: ${{ vars.REVE_API_KEY_EXPIRES_ON || '2027-10-29' }}
        run: node scripts/verify-reve.mjs
      - name: Señalar renovación necesaria con antelación
        if: steps.credential.outputs.days_remaining != '' && fromJSON(steps.credential.outputs.days_remaining) <= 30
        run: |
          echo '::error::La credencial REVE entra en su último mes de validez. Solicita renovación oficial y actualiza el secreto y la fecha en Actions. La sincronización de datos sigue mientras la clave sea válida.'
          exit 1
